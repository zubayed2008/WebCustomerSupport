name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore SupportDesk.slnx
      - name: Build
        run: dotnet build SupportDesk.slnx --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test tests/SupportDesk.UnitTests/SupportDesk.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit.trx"
      - name: Integration tests
        run: dotnet test tests/SupportDesk.IntegrationTests/SupportDesk.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=integration.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/supportdesk-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/supportdesk-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/SupportDesk.Api/Dockerfile -t supportdesk-api:ci .
      - name: Build worker image
        run: docker build -f src/SupportDesk.Worker/Dockerfile -t supportdesk-worker:ci .
      - name: Build web image
        run: docker build -f src/supportdesk-web/Dockerfile -t supportdesk-web:ci .
